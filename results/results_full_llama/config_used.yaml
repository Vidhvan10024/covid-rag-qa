seed: 42
output_dir: results_full_llama
cache_dir: cache
trec_covid:
  beir_url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/trec-covid.zip
  max_docs: null
covid_qa:
  hf_id: deepset/covid_qa_deepset
  chunk_words: 100
  dev_fraction: 0.2
retrievers:
  bm25:
    k1: 0.9
    b: 0.4
  dense:
    bge:
      query_model: BAAI/bge-base-en-v1.5
      doc_model: BAAI/bge-base-en-v1.5
      pooling: cls
      query_prefix: 'Represent this sentence for searching relevant passages: '
      doc_prefix: ''
      title_pair: false
      normalize: true
      max_len_query: 64
      max_len_doc: 512
    medcpt:
      query_model: ncbi/MedCPT-Query-Encoder
      doc_model: ncbi/MedCPT-Article-Encoder
      pooling: cls
      query_prefix: ''
      doc_prefix: ''
      title_pair: true
      normalize: false
      max_len_query: 64
      max_len_doc: 512
  hybrid:
    rrf_k: 60
    depth: 1000
  reranker:
    model: ncbi/MedCPT-Cross-Encoder
    depth: 100
    max_len: 512
  batch_size: 64
retrieval_eval:
  metrics:
  - ndcg@10
  - precision@10
  - mrr@10
  - map@100
  - recall@100
  stat_test: paired_randomisation
  permutations: 10000
  alpha: 0.05
qa:
  reader_model: meta-llama/Llama-3.1-8B-Instruct
  load_in_4bit: true
  batch_size: 8
  save_every: 64
  max_new_tokens: 64
  top_k: 10
  conditions:
  - closed_book
  - oracle
  - bm25
  - bge
  - medcpt
  - hybrid
  - hybrid_rerank
  ablation_k:
  - 1
  - 3
  - 5
  - 10
  ablation_chunk_words:
  - 100
  - 200
  - 400
  nli_model: cross-encoder/nli-deberta-v3-base
  bootstrap_samples: 10000
  equivalence_margin_f1: 0.05
  alpha: 0.05
  max_questions: null
