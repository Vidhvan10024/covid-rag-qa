# =====================================================================
#  Experiment configuration for "Does Better Retrieval Mean Better
#  Answers? Selecting Retrievers for Retrieval-Augmented Question
#  Answering over a COVID-19 Scholarly Collection".
#  Every number reported in the paper can be traced to this file.
# =====================================================================
seed: 42
output_dir: results
cache_dir: cache

# ---------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------
trec_covid:                     # Experiment 1 (retrieval), BEIR version
  beir_url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/trec-covid.zip
  max_docs: null                # e.g. 20000 for a quick laptop run; null = all 171,332

covid_qa:                       # Experiments 2-3 (end-to-end QA)
  hf_id: deepset/covid_qa_deepset
  chunk_words: 200              # default passage length in words (stride = 50% overlap)
  dev_fraction: 0.2             # document-grouped split used ONLY for ablation choices

# ---------------------------------------------------------------------
# Retrievers (independent variable #1)
# ---------------------------------------------------------------------
retrievers:
  bm25: {k1: 0.9, b: 0.4}       # Anserini/BEIR defaults — do not tune on test
  dense:
    bge:                        # general-domain dense encoder
      query_model: BAAI/bge-base-en-v1.5
      doc_model: BAAI/bge-base-en-v1.5
      pooling: cls
      query_prefix: "Represent this sentence for searching relevant passages: "
      doc_prefix: ""
      title_pair: false
      normalize: true             # cosine similarity (as in the BGE model card)
      max_len_query: 64
      max_len_doc: 512
    medcpt:                     # biomedical dense encoder (PubMed search logs)
      query_model: ncbi/MedCPT-Query-Encoder
      doc_model: ncbi/MedCPT-Article-Encoder
      pooling: cls
      query_prefix: ""
      doc_prefix: ""
      title_pair: true
      normalize: false            # raw dot product s(q,d) = q^T d, as in Jin et al. (2023)
      max_len_query: 64
      max_len_doc: 512
  hybrid: {rrf_k: 60, depth: 1000}
  reranker:
    model: ncbi/MedCPT-Cross-Encoder
    depth: 100                  # re-rank top-100 of the first stage
    max_len: 512
  batch_size: 64

retrieval_eval:
  metrics: [ndcg@10, precision@10, mrr@10, map@100, recall@100]   # + capped R@100 (BEIR's TREC-COVID measure)
  stat_test: paired_randomisation   # Fisher's two-sided sign-flip randomisation test (Smucker et al., 2007)
  permutations: 10000
  alpha: 0.05

# ---------------------------------------------------------------------
# Reader / generator (independent variable #2)
# ---------------------------------------------------------------------
qa:
  reader_model: Qwen/Qwen2.5-7B-Instruct   # alt: meta-llama/Llama-3.1-8B-Instruct
  load_in_4bit: true                        # fits a 16 GB T4 (Colab/Kaggle)
  batch_size: 8
  save_every: 64                # answers are checkpointed every 64 questions
  max_new_tokens: 64
  top_k: 5
  conditions: [closed_book, oracle, bm25, bge, medcpt, hybrid, hybrid_rerank]
  ablation_k: [1, 3, 5, 10]
  ablation_chunk_words: [100, 200, 400]
  nli_model: cross-encoder/nli-deberta-v3-base   # scored on 1-2 sentence windows of CITED passages
  bootstrap_samples: 10000
  equivalence_margin_f1: 0.05   # TOST margin for "matches the oracle", fixed before the full run
  alpha: 0.05
  max_questions: null           # e.g. 200 for a pilot run
